<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Import Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

    <!--Import AJAX-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!--Import JavaScript-->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <title>Modo criança - AACProject</title>
  </head>
  <body class="container">
    <div id="page_content">
        <div class="row row-cols-{{kid.card_size}} mt-3">
  {% for deck in kid.decks %}

  <div class="card me-3 mt-3">
    <a
      onclick="loadDeck('{{user.username}}', '{{kid.id}}', '{{deck.id}}')"
    >
      <img
        src="../../../{{deck.image_path}}"
        class="card-img-top pt-2"
        alt="Baralho sobre {{deck.name}}"
        height="250"
      />
    </a>

    <div class="card-body">
    <h5 class="card-title align-self-center">{{deck.name}}</h5>
    </div>
  </div>
  {% endfor %}
    </div>
  </body>
</html>
