<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Import Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

    <!--Import Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">

    <title>Modo criança - AACProject</title>
  </head>
  <body class="container">
    <div id="page_content">
        <a href="{{url_for('kid_mode', username = user.username, kid_id = kid.id)}}"><button type="button" class="btn btn-lg btn-primary mt-3"><i class="bi bi-skip-backward"></i> Voltar para trás</button></a>
        <div class="row row-cols-{{kid.card_size}} mt-2">
            {% for card in deck.cards %}
            <div class="card me-3 mt-3">
                <a
                onclick="playAudio('../../../../{{card.audio_path}}')"
                >
                <img
                    src="../../../{{card.image_path}}"
                    class="card-img-top pt-2"
                    alt="Baralho sobre {{card.name}}"
                    height="250"
                />
                </a>

                <div class="card-body">
                <h5 class="card-title align-self-center">{{card.name}}</h5>
            </div>
        </div> 
        {% endfor %}
    </div>
  </body>
</html>
