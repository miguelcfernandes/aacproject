<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/favicon.png') }}"
    />

    <title>Pagina inicial - AACProject</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('homepage') }}">
          <img
            src="{{ url_for('static', filename='img/logo.svg') }}"
            alt="AACProject"
            width="120"
            height="75"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarSupportedContent"
        >
          <ul class="navbar-nav">
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Mais
              </a>
              <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" href="#">Documentação</a></li>
                <li>
                  <a
                    class="dropdown-item"
                    href="mailto: geral@colegioatlantico.pt"
                    >Contacte-nos</a
                  >
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a href="{{ url_for('sign_in') }}"
                ><button
                  type="button"
                  class="btn btn-outline-primary mx-lg-3 my-sm-3 my-lg-0"
                >
                  Acessar
                </button></a
              >
            </li>
            <li class="nav-item">
              <a href="{{ url_for('sign_up') }}"
                ><button type="button" class="btn btn-primary">
                  Registar
                </button></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Footer -->
    <footer class="bg-light text-center text-lg-start fixed-bottom">
      <div class="text-center p-3">
        © 2022 Copyright:
        <a class="text-dark" href="{{ url_for('homepage') }}">AACProject</a>
      </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
