<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
      integrity="sha384-zCbKRCUGaJDkqS1kPbPd7TveP5iyJE0EjAuZQTgFLD2ylzuqKfdKlfG/eSrtxUkn"
      crossorigin="anonymous"
    />

    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/signin.css') }}"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/favicon.png') }}"
    />

    <title>Acessar a conta - AACProject</title>
  </head>
  <body class="text-center">
    <form class="form-signin" method="POST">
      {% with messages = get_flashed_messages() %} {% if messages %} {% for
      message in messages %}
      <div class="alert alert-warning" role="alert">{{message}}</div>
      {% endfor %} {% endif %} {% endwith %}
      <img
        class="mb-4"
        src="{{ url_for('static', filename='img/logo.svg') }}"
        alt="AACProject"
        width="150"
        height="72"
      />
      <h1 class="h3 mb-3 font-weight-normal">Acesse a sua conta</h1>
      <label for="inputEmail" class="sr-only">Endereço de e-mail</label>
      <input
        type="email"
        name="email"
        id="inputEmail"
        class="form-control mb-1"
        placeholder="Endereço de e-mail"
        required
        autofocus
      />
      <label for="inputPassword" class="sr-only">Palavra-passe</label>
      <input
        type="password"
        name="password"
        id="inputPassword"
        class="form-control mb-1"
        placeholder="Palavra-passe"
        required
      />
      <div class="checkbox mb-3">
        <input type="checkbox" value="remember-me" name="rememberMe" />
        Relembre-me
      </div>
      <button class="btn btn-lg btn-primary btn-block mb-3" type="submit">
        Acesse
      </button>
      <a href="{{ url_for('forgot_password') }}">Esqueceste-te da palavra-passe?</a>
      <p class="mt-3 mb-3 text-muted">AACProject &copy; 2022</p>
      <a href="{{ url_for('homepage') }}">« De volta para a página inicial</a>
    </form>

    <!-- Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
